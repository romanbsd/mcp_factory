base_url = "https://androidpublisher.googleapis.com"
server_name = "google-play-mcp"
transport = "stdio"
# Media uploads are disabled unless MCP_FACTORY_MEDIA_ROOT is set to an
# operator-controlled staging directory. Never place credentials in that root.

[auth]
type = "google_service_account"
credentials_path_env = "GOOGLE_APPLICATION_CREDENTIALS"
scopes = [
  "https://www.googleapis.com/auth/androidpublisher",
  "https://www.googleapis.com/auth/playdeveloperreporting",
]
# Install reports (reports_install* tools) reuse this service-account key with a
# separate devstorage.read_only token; do not add that scope here. Configure
# them with GOOGLE_PLAY_DEVELOPER_ID or GOOGLE_PLAY_REPORTS_BUCKET (see README).
