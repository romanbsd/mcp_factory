base_url = "https://api.appstoreconnect.apple.com/"
server_name = "app-store-connect-mcp"
transport = "stdio"
# Strip JSON:API links/link-only relationships and minify responses.
compact_jsonapi = true
# Tool profiles to expose (or set MCP_FACTORY_PROFILES=a,b). "all" exposes
# every tool.
# Unset uses the generated default: workflow.
# Available: assets, core, metadata, monetization, monetization_raw, pricing, release_raw, reports, reports_raw, reviews, signing, signing_raw, testflight, testflight_raw, workflow
# profiles = ["workflow"]

# App Store Connect JWT auth (all three named variables must be set):
# [auth]
# type = "external"
# provider = "app_store_connect"
# [auth.options]
# key_id_env = "ASC_KEY_ID"
# issuer_id_env = "ASC_ISSUER_ID"
# private_key_path_env = "ASC_PRIVATE_KEY_PATH"
# These three legacy variables also enable JWT auth when auth is auto or omitted.
# A partial set fails startup in auto mode. An explicit type = "none" disables auth.

# Static bearer token (reads MCP_FACTORY_BEARER_TOKEN by default):
# [auth]
# type = "bearer"

# OAuth2 Authorization Code + PKCE (single account, file token store):
# [auth]
# type = "oauth2"
# authorization_endpoint = "https://provider.example.com/oauth/authorize"
# token_endpoint = "https://provider.example.com/oauth/token"
# client_id = "your-client-id"
# scopes = ["read", "write"]
# client_secret via env: MCP_FACTORY_OAUTH_CLIENT_SECRET
# redirect_uri = "http://127.0.0.1:9876/callback"  # optional; ephemeral port if omitted
# token_store = ".mcp-factory/tokens.json"           # optional
#
# On a stdio server the browser login flow launches automatically on the first
# tool call that needs a token (and refreshes silently after that). To log in
# ahead of time (or for HTTP transport, where auto-login is disabled):
#   mcp-factory-auth login --config config.toml
#   cargo run -- --auth-login
