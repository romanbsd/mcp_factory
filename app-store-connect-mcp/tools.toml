analytics_segment_download = ["reports"]

[descriptions]
apps_getCollection = "Find apps. Filter by `filter[bundleId]` or `filter[name]` to resolve an app ID; never guess IDs."
builds_getCollection = "Find builds. Filter by `filter[app]`, `filter[version]` (build number), `filter[preReleaseVersion.version]` (marketing version) and `filter[processingState]=VALID` to find a build ready to attach."
builds_updateInstance = "Update a build: `usesNonExemptEncryption` (export compliance answer supplied by the user), `expired=true` to expire it from TestFlight."
appStoreVersions_createInstance = "Create a new App Store version (`versionString`, `platform`) for an app. Localizations are copied from the previous version."
appStoreVersions_updateInstance = "Update an App Store version: `versionString`, `releaseType` (MANUAL, AFTER_APPROVAL, SCHEDULED), `earliestReleaseDate`, `copyright`."
appStoreVersions_build_updateToOneRelationship = "Attach a processed build to an App Store version (body: `data: {type: builds, id}`). Use a build with `processingState=VALID`."
appStoreReviewDetails_createInstance = "Create App Review details (contact, demo account, notes) for a version that has none; check `appStoreVersions_appStoreReviewDetail_getToOneRelated` first."
reviewSubmissions_createInstance = "Start a review submission for an app and platform. Then add items with `reviewSubmissionItems_createInstance` and submit with `reviewSubmissions_updateInstance`."
reviewSubmissionItems_createInstance = "Add an item (e.g. an `appStoreVersion`) to a review submission that has not been submitted yet."
reviewSubmissions_updateInstance = "Submit a review submission to App Review (`submitted: true`) or cancel it (`canceled: true`)."
reviewSubmissions_getCollection = "List review submissions. Filter by `filter[app]` and `filter[state]` (READY_FOR_REVIEW, WAITING_FOR_REVIEW, IN_REVIEW, UNRESOLVED_ISSUES, COMPLETING, COMPLETE, CANCELING) to inspect review status."
appStoreVersionPhasedReleases_createInstance = "Enable a 7-day phased release for an App Store version."
appStoreVersionPhasedReleases_updateInstance = "Control a phased release: `phasedReleaseState` ACTIVE (resume), PAUSED, or COMPLETE (release to everyone now)."
appStoreVersionPhasedReleases_deleteInstance = "Remove a phased release from a version that has not started releasing, so it releases to everyone at once."
appStoreVersionReleaseRequests_createInstance = "Release an approved App Store version that uses manual release (state PENDING_DEVELOPER_RELEASE). This publishes the app."
appStoreVersionLocalizations_updateInstance = "Update store text for one locale of a version: `description`, `keywords`, `whatsNew`, `promotionalText`, `marketingUrl`, `supportUrl`. Read it first with `appStoreVersionLocalizations_getInstance`."
appInfoLocalizations_updateInstance = "Update app-level text for one locale: `name`, `subtitle`, `privacyPolicyUrl`, `privacyChoicesUrl`, `privacyPolicyText`."
appInfos_updateInstance = "Update App Info relationships such as `primaryCategory`/`secondaryCategory` (IDs from `appCategories_getCollection`)."
ageRatingDeclarations_updateInstance = "Update age-rating questionnaire answers. The values must come from the user; the resulting rating is shown on the App Info."
appEncryptionDeclarations_createInstance = "Create an export-compliance declaration from answers supplied by the user. This tool never decides compliance."
appScreenshotSets_createInstance = "Create a screenshot set for one `screenshotDisplayType` (e.g. APP_IPHONE_67) under a version localization. List existing sets first."
appScreenshotSets_appScreenshots_replaceToManyRelationship = "Reorder the screenshots in a set: send every screenshot ID in the desired order."
appScreenshots_createInstance = "Low-level step 1 of an upload (reserve). Prefer `asset_upload`, which performs reserve, upload, commit and processing checks."
appScreenshots_updateInstance = "Low-level step 3 of an upload (commit with `uploaded: true` and `sourceFileChecksum`). Prefer `asset_upload`."
appScreenshots_deleteInstance = "Delete a screenshot from its set. This cannot be undone."
appPreviewSets_appPreviews_replaceToManyRelationship = "Reorder the previews in a set: send every preview ID in the desired order."
appPreviews_createInstance = "Low-level step 1 of an upload (reserve). Prefer `asset_upload`."
appPreviews_updateInstance = "Low-level commit step or `previewFrameTimeCode` update. Prefer `asset_upload` for uploads."
betaGroups_createInstance = "Create a TestFlight group for an app. `isInternalGroup` true for App Store Connect users; external groups need Beta App Review before testers can install."
betaGroups_builds_createToManyRelationship = "Add builds to a TestFlight group (body: `data: [{type: builds, id}]`)."
betaGroups_betaTesters_createToManyRelationship = "Add existing testers to a TestFlight group."
betaTesters_getCollection = "Find TestFlight testers. Filter by `filter[email]`, `filter[apps]` or `filter[betaGroups]`."
betaTesters_createInstance = "Invite a tester by email into one or more beta groups (relationship `betaGroups`) or builds. Sends an invitation email."
betaTesters_deleteInstance = "Remove a tester from all apps and groups. This cannot be undone."
betaBuildLocalizations_updateInstance = "Update TestFlight 'What to Test' (`whatsNew`) for one locale of a build."
betaAppReviewSubmissions_createInstance = "Submit a build to Beta App Review so external TestFlight groups can test it."
betaAppReviewDetails_updateInstance = "Update Beta App Review contact, demo account (`demoAccountRequired`, `demoAccountName`, `demoAccountPassword`) and notes. Apple creates this resource with the app; there is no create."
customerReviewResponses_createInstance = "Publish a developer response to a customer review. If a response exists it is replaced."
customerReviewResponses_deleteInstance = "Delete the developer response to a customer review. This cannot be undone."
certificates_createInstance = "Create a signing certificate from a certificate signing request (`csrContent`, `certificateType`)."
certificates_deleteInstance = "Revoke a signing certificate. Apps and profiles that use it stop working. This cannot be undone."
profiles_createInstance = "Create a provisioning profile for a bundle ID, certificates and (for development/ad hoc) devices. The response includes `profileContent` (base64)."
profiles_deleteInstance = "Delete a provisioning profile. This cannot be undone."
devices_createInstance = "Register a device UDID for development/ad hoc provisioning. Registrations count against the yearly device limit."
territories_getCollection = "List App Store territories and their currencies; use these IDs instead of guessing territory codes."
salesReports_getCollection = "Download a sales report (gzip TSV, returned as text). Requires `filter[vendorNumber]`, `filter[reportType]`, `filter[reportSubType]`, `filter[frequency]`."
financeReports_getCollection = "Download a finance report (gzip TSV, returned as text). Requires `filter[vendorNumber]`, `filter[reportType]`, `filter[regionCode]`, `filter[reportDate]`."
analyticsReportSegments_getInstance = "Get an analytics report segment, including its download `url`. Use `analytics_segment_download` to fetch and decompress it."
