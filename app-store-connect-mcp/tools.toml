    # Version localizations: description, keywords, What's New, URLs.
    "appStoreVersions_appStoreVersionLocalizations_getToManyRelated",
    "appStoreVersionLocalizations_createInstance",
    "appStoreVersionLocalizations_getInstance",
    "appStoreVersionLocalizations_updateInstance",
    "appStoreVersionLocalizations_deleteInstance",
    # Export compliance (declarations are inspected/created, never decided).
    "apps_appEncryptionDeclarations_getToManyRelated",
    "appEncryptionDeclarations_createInstance",
    "appEncryptionDeclarations_getCollection",
    "appEncryptionDeclarations_getInstance",
    "builds_appEncryptionDeclaration_updateToOneRelationship",
    "builds_appEncryptionDeclaration_getToOneRelated",
    "appEncryptionDeclarationDocuments_getInstance",
]

