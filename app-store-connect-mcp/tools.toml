# App Store Connect tool curation for `mcp-gen --tool-config` (see
# scripts/regenerate.sh). Profiles are selected at runtime with `profiles` in
# config.toml or MCP_FACTORY_PROFILES; "all" exposes every profile below.
#
# Patterns are Apple operationIds (`*` and `?` wildcards); each must match at
# least one non-deprecated operation in openapi.oas.json. Related reads use
# `*_getToManyRelated` (full resources) rather than `*_getToManyRelationship`
# (IDs only) unless the IDs alone are what a workflow needs.

default_profiles = ["core", "metadata", "assets", "testflight"]

# Apple paginates with an opaque `cursor` carried in `links.next`.
cursor_param = "cursor"

# Sparse fieldsets (`fields[type]`) list every attribute name of every
# includable type: almost half of tools/list. Keep the parameters, drop the
# enum lists; attribute names are visible in any response.
strip_enums = ["fields[*]"]

[profiles]
core = [
    # Find the app, its versions and builds.
    "apps_getCollection",
    "apps_getInstance",
    "apps_appStoreVersions_getToManyRelated",
    "apps_builds_getToManyRelated",
    "builds_getCollection",
    "builds_getInstance",
    "builds_updateInstance",
    # Create/update the App Store version and attach a build.
    "appStoreVersions_createInstance",
    "appStoreVersions_getInstance",
    "appStoreVersions_updateInstance",
    "appStoreVersions_deleteInstance",
    "appStoreVersions_build_getToOneRelated",
    "appStoreVersions_build_updateToOneRelationship",
    # App Review details (contact, demo account, notes).
    "appStoreVersions_appStoreReviewDetail_getToOneRelated",
    "appStoreReviewDetails_createInstance",
    "appStoreReviewDetails_getInstance",
    "appStoreReviewDetails_updateInstance",
    # Submit for review and inspect the submission.
    "reviewSubmissions_*",
    "reviewSubmissionItems_*",
    # Release.
    "appStoreVersions_appStoreVersionPhasedRelease_getToOneRelated",
    "appStoreVersionPhasedReleases_*",
    "appStoreVersionReleaseRequests_createInstance",
]

