[package]
name = "mcp-factory-provider-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Optional provider authentication adapters for MCP Factory"
readme = "README.md"

[features]
default = []
google = ["dep:gcp_auth", "dep:reqwest", "dep:tokio", "dep:ring"]
app-store-connect = ["dep:ring", "dep:base64", "dep:reqwest", "dep:tokio"]

[dependencies]
serde.workspace = true
mcp-factory-core.workspace = true
async-trait.workspace = true
gcp_auth = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
